name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo doesn't have gradlew/gradle-wrapper.jar checked in yet
      # (only gradle/wrapper/gradle-wrapper.properties), so this installs
      # Gradle itself rather than relying on the wrapper. Once gradlew is
      # added (run `gradle wrapper` locally and commit the result), swap
      # the run steps below to `./gradlew ...` and this action will use
      # the wrapper automatically.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Lint
        run: gradle lint --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
